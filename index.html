<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Taste Restaurant | Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1f1c; --bg2:#1c3a33; --gold:#e8b04a; --text:#f6f1e7; --muted:#b9c4bd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Poppins',Arial,sans-serif;color:var(--text);
    background:radial-gradient(circle at 20% 10%,var(--bg2),var(--bg) 60%);
    display:flex;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .card{max-width:720px;width:100%}
  .badge{
    display:inline-block;padding:12px 34px;
    background:linear-gradient(135deg,#f5c76a,var(--gold));
    color:#1a1a1a;font-weight:600;border-radius:999px;
    font-size:1.05rem;letter-spacing:.3em;text-transform:uppercase;
    margin-bottom:30px;
    box-shadow:0 0 24px rgba(232,176,74,.55),0 6px 18px rgba(0,0,0,.35);
  }
  h1{
    font-family:'Playfair Display',Georgia,serif;font-weight:800;
    font-size:clamp(2.4rem,8vw,4.5rem);line-height:1.1;
  }
  h1 span{color:var(--gold)}
  .tag{color:var(--muted);font-weight:300;margin:18px auto 36px;max-width:480px;line-height:1.7}
  .timer{display:flex;gap:12px;justify-content:center;margin-bottom:36px;flex-wrap:wrap}
  .box{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:14px 10px;min-width:78px;
  }
  .box b{display:block;font-family:'Playfair Display',serif;font-size:2rem;color:var(--gold)}
  .box small{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
  .notify{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
  .notify input{
    flex:1 1 240px;max-width:320px;padding:14px 18px;border-radius:999px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);
    color:var(--text);font:inherit;outline:none;
  }
  .notify input:focus{border-color:var(--gold)}
  .notify button,.map{
    padding:14px 28px;border-radius:999px;border:0;background:var(--gold);
    color:#1a1a1a;font:500 1rem 'Poppins',sans-serif;cursor:pointer;text-decoration:none;
  }
  .notify button:hover,.map:hover{filter:brightness(1.1)}
  .msg{min-height:1.4em;color:var(--gold);font-size:.9rem;margin-bottom:12px}
  .map{display:inline-block;background:transparent;border:1px solid var(--gold);color:var(--gold)}
  footer{margin-top:36px;font-size:.8rem;color:var(--muted)}

  /* ---------- Animations ---------- */
  body{min-height:100vh;min-height:100svh;overflow-x:hidden;position:relative}
  .card{position:relative;z-index:1}

  /* photo background */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:
      linear-gradient(180deg,rgba(15,31,28,.72) 0%,rgba(15,31,28,.82) 55%,rgba(15,31,28,.93) 100%),
      url("restaurant.jpg") center/cover no-repeat;
    animation:zoom 25s ease-in-out infinite alternate;
  }
  @keyframes zoom{from{transform:scale(1)}to{transform:scale(1.12)}}
  @media (max-width:600px){ body::before{background-position:35% center} }

  @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  .card > *{opacity:0;animation:fadeUp .8s ease forwards}
  .card > :nth-child(1){animation-delay:.1s}
  .card > :nth-child(2){animation-delay:.3s}
  .card > :nth-child(3){animation-delay:.5s}
  .card > :nth-child(4){animation-delay:.7s}
  .card > :nth-child(5){animation-delay:.9s}
  .card > :nth-child(6){animation-delay:1s}
  .card > :nth-child(7){animation-delay:1.1s}
  .card > :nth-child(8){animation-delay:1.2s}

  /* pulsing badge */
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,176,74,.5)}50%{box-shadow:0 0 0 12px rgba(232,176,74,0)}}
  .badge{animation:fadeUp .8s ease .1s forwards,pulse 2.2s ease-in-out 1s infinite}

  /* shimmering gold word */
  @keyframes shine{to{background-position:200% center}}
  h1 span{
    background:linear-gradient(90deg,var(--gold),#fff3c9,var(--gold));
    background-size:200% auto;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;animation:shine 3s linear infinite;
  }

  /* timer boxes float + hover */
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .box{transition:transform .3s,border-color .3s}
  .box:hover{border-color:var(--gold);transform:translateY(-4px) scale(1.05)}
  .box:nth-child(odd) b{animation:float 3s ease-in-out infinite}
  .box:nth-child(even) b{animation:float 3s ease-in-out 1.5s infinite}

  /* buttons */
  .notify button,.map{transition:transform .25s,box-shadow .25s,filter .25s}
  .notify button:hover,.map:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(232,176,74,.35)}
  .map:hover{background:var(--gold);color:#1a1a1a}

  /* floating background bubbles */
  .bubbles{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
  .bubbles i{
    position:absolute;bottom:-60px;border-radius:50%;
    background:rgba(232,176,74,.12);animation:rise linear infinite;
  }
  @keyframes rise{to{transform:translateY(-115vh) scale(1.3);opacity:0}}
  .bubbles i:nth-child(1){left:8%;width:30px;height:30px;animation-duration:14s}
  .bubbles i:nth-child(2){left:22%;width:60px;height:60px;animation-duration:19s;animation-delay:3s}
  .bubbles i:nth-child(3){left:45%;width:24px;height:24px;animation-duration:12s;animation-delay:1s}
  .bubbles i:nth-child(4){left:63%;width:50px;height:50px;animation-duration:17s;animation-delay:5s}
  .bubbles i:nth-child(5){left:80%;width:36px;height:36px;animation-duration:15s;animation-delay:2s}
  .bubbles i:nth-child(6){left:92%;width:20px;height:20px;animation-duration:11s;animation-delay:6s}

  /* ---------- Responsive ---------- */
  @media (max-width:600px){
    body{padding:18px 14px}
    .badge{font-size:.85rem;letter-spacing:.2em;padding:10px 24px;margin-bottom:22px}
    .tag{font-size:.92rem;margin:14px auto 26px}
    .timer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .box{min-width:0;padding:12px 4px}
    .box b{font-size:1.5rem}
    .box small{font-size:.58rem;letter-spacing:.08em}
    .notify{flex-direction:column;align-items:stretch}
    .notify input{max-width:none;flex:none}
    .notify button,.map{width:100%}
  }
  @media (max-width:340px){
    .box b{font-size:1.2rem}
  }
  @media (max-height:520px) and (orientation:landscape){
    body{align-items:flex-start}
    h1{font-size:2rem}
  }
  @media (min-width:1200px){
    .card{max-width:820px}
  }

  /* respect users who prefer less motion */
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .card > *{opacity:1}
  }
</style>
</head>
<body>
  <div class="bubbles"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <main class="card">
    <div class="badge">Coming Soon</div>
    <h1>Island <span>Taste</span><br>Restaurant </h1>
    <p class="tag">Something delicious is on the way. Fresh flavours, warm island hospitality, and a table waiting for you.</p>

    <div class="timer" id="timer">
      <div class="box"><b id="d">00</b><small>Days</small></div>
      <div class="box"><b id="h">00</b><small>Hours</small></div>
      <div class="box"><b id="m">00</b><small>Minutes</small></div>
      <div class="box"><b id="s">00</b><small>Seconds</small></div>
    </div>

    <form class="notify" id="form">
      <input type="email" id="email" placeholder="Your email for launch updates" required>
      <button type="submit">Notify Me</button>
    </form>
    <div class="msg" id="msg"></div>

    <a class="map" target="_blank" rel="noopener"
       href="https://maps.app.goo.gl/NxdsiitvSJbrKAU79">📍 Find us on Google Maps</a>

    <footer>&copy; 2026 Island Taste Restaurant</footer>
  </main>

<script>
  // Change this to your real opening date
  const launch = new Date("2026-11-15T10:00:00").getTime();
  const pad = n => String(n).padStart(2,"0");
  function tick(){
    const diff = Math.max(0, launch - Date.now());
    d.textContent = pad(Math.floor(diff/864e5));
    h.textContent = pad(Math.floor(diff%864e5/36e5));
    m.textContent = pad(Math.floor(diff%36e5/6e4));
    s.textContent = pad(Math.floor(diff%6e4/1e3));
  }
  tick(); setInterval(tick,1000);

  // Demo only: connect to Formspree / Mailchimp / your backend to really collect emails
  document.getElementById("form").addEventListener("submit",e=>{
    e.preventDefault();
    msg.textContent = "Thanks! We'll let you know when we open 🍽️";
    e.target.reset();
  });
</script>
</body>
</html>
